<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Academy Drafts — Prayer Army International</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{background:#0a1424;color:#f5f1e8;margin:0}header{padding:22px max(20px,calc((100% - 1050px)/2));background:#111d30;border-bottom:2px solid #b99a4a}h1{margin:0;font-family:Georgia,serif}main{max-width:1050px;margin:auto;padding:25px 20px}a{color:#e8c56c}section{background:#132136;border:1px solid #354560;border-radius:12px;padding:20px;margin:20px 0}label{display:block;margin:13px 0 5px;color:#f0d78c;font-weight:600}input,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;background:#0a1526;color:#fff;border:1px solid #65748d;border-radius:7px;font:inherit}button{background:#d7b65c;border:0;border-radius:7px;padding:12px 20px;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.6}li{margin:10px 0;overflow-wrap:anywhere}.muted{color:#b8c6d8}#status{min-height:22px}article{border-top:1px solid #354560;padding:14px 0}</style></head><body>
<header><h1>Academy · Course Drafts</h1><p>Prayer Army International · Staff-only staging workspace</p></header>
<main><p><a href="/admin">← Site Manager</a> · <a href="/church">Church Management</a></p><p class="muted">Create draft courses and lessons. Nothing here is published to students; exams remain disabled.</p><p id="status" role="status" aria-live="polite">Checking administrator access…</p>
<section><h2>New course</h2><form id="course-form"><label for="title">Course title</label><input id="title" required maxlength="200"><label for="slug">URL identifier (lowercase, hyphens)</label><input id="slug" required maxlength="200" pattern="[a-z0-9]+(-[a-z0-9]+)*"><label for="description">Description</label><textarea id="description" rows="3"></textarea><button>Create draft</button></form></section>
<section><h2>Draft courses</h2><div id="courses"></div></section>
</main><script type="module">
const api='/api/academy/staff',status=document.querySelector('#status'),list=document.querySelector('#courses');
async function request(path,options={}){const response=await fetch(api+path,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Request failed ('+response.status+')');return data}
const message=(text)=>status.textContent=text;
async function refresh(){try{const data=await request('/courses');list.replaceChildren();if(!data.courses.length)list.textContent='No courses yet.';for(const c of data.courses){const article=document.createElement('article'),h=document.createElement('h3'),p=document.createElement('p'),button=document.createElement('button'),form=document.createElement('form'),label=document.createElement('label'),input=document.createElement('input'),textarea=document.createElement('textarea');h.textContent=c.title;p.textContent=(c.description||'No description')+' · '+c.status;button.textContent='Add lesson';label.textContent='Lesson title';input.required=true;input.maxLength=200;textarea.placeholder='Lesson content';textarea.rows=3;form.hidden=true;form.append(label,input,textarea);form.append(document.createElement('br'));const submit=document.createElement('button');submit.textContent='Save draft lesson';form.append(submit);button.onclick=()=>form.hidden=!form.hidden;form.onsubmit=async e=>{e.preventDefault();try{await request('/courses/'+encodeURIComponent(c.id)+'/lessons',{method:'POST',body:JSON.stringify({title:input.value,content:textarea.value})});message('Lesson draft saved');form.reset();form.hidden=true}catch(err){message(err.message)}};article.append(h,p);if(c.status==='draft')article.append(button,form);list.append(article)}message('Draft course list loaded.');}catch(err){message(err.message);list.textContent='Courses unavailable.'}}
document.querySelector('#course-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget;try{await request('/courses',{method:'POST',body:JSON.stringify({title:document.querySelector('#title').value,slug:document.querySelector('#slug').value,description:document.querySelector('#description').value})});form.reset();await refresh();message('Draft course created.')}catch(err){message(err.message)}};
refresh();
</script></body></html>
