<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>My Academy | Prayer Army International</title><style>body{margin:0;background:#0b1525;color:#f6f2e7;font:16px system-ui,sans-serif}header{background:#13223a;padding:24px;border-bottom:2px solid #c7a354}main{max-width:960px;margin:auto;padding:20px}h1,h2{font-family:Georgia,serif}a{color:#e7c46d}section{background:#16263d;padding:20px;border-radius:12px;margin:18px 0}article{border-top:1px solid #41516c;padding:16px 0}button{background:#e2c36b;color:#111;border:0;padding:11px 17px;border-radius:7px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#b9c6d6}#status{min-height:24px}</style></head><body><header><h1>Prayer Army Academy</h1><p>Learn · Grow · Serve</p></header><main><p><a href="/member">Member portal</a> · <a href="/">Public website</a></p><p class="muted">Only published courses appear here. Sign in through the Member Portal first.</p><p id="status" role="status" aria-live="polite"></p><section><h2>Available courses</h2><div id="available"></div></section><section><h2>My enrollments</h2><div id="enrolled"></div></section><section><h2>My lessons</h2><div id="lessons">Choose an enrolled course to view published lessons.</div></section></main><script type="module">
const api='/api/public/academy',status=document.querySelector('#status');
async function request(path,options={}){const res=await fetch(api+path,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...options});const body=await res.json().catch(()=>({}));if(!res.ok)throw Error(body.error||'Request failed');return body;}
function message(text){status.textContent=text}
function element(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function loadLessons(id){try{const data=await request('/courses/'+encodeURIComponent(id)+'/lessons');const target=document.querySelector('#lessons');target.replaceChildren();if(!data.lessons.length)target.textContent='No published lessons yet.';for(const lesson of data.lessons){const item=element('article',''),heading=element('h3',lesson.title),content=element('p',lesson.content||'');item.append(heading,content);target.append(item)}message('Lessons loaded')}catch(e){message(e.message)}}
async function refresh(){try{const [catalog,mine]=await Promise.all([request('/courses'),request('/my-courses')]);const available=document.querySelector('#available'),enrolled=document.querySelector('#enrolled');available.replaceChildren();enrolled.replaceChildren();if(!catalog.courses.length)available.textContent='No published courses yet.';for(const course of catalog.courses){const item=element('article',''),h=element('h3',course.title),p=element('p',course.description||''),btn=element('button','Enroll');btn.onclick=async()=>{btn.disabled=true;try{await request('/courses/'+encodeURIComponent(course.id)+'/enroll',{method:'POST'});await refresh();message('Enrollment saved')}catch(e){message(e.message);btn.disabled=false}};item.append(h,p,btn);available.append(item)}if(!mine.courses.length)enrolled.textContent='You have not enrolled in any courses.';for(const course of mine.courses){const item=element('article',''),h=element('h3',course.title),p=element('p','Status: '+course.enrollment_status),btn=element('button','View lessons');btn.onclick=()=>loadLessons(course.id);item.append(h,p,btn);enrolled.append(item)}message('Academy courses loaded')}catch(e){message(e.message+' — sign in through the Member Portal or ask an administrator to enable the Academy.')}}refresh();
</script></body></html>
