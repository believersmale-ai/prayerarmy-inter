<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member Registration | Prayer Army International</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a1224;color:#f9f5e9;font:16px/1.5 system-ui,sans-serif}main{max-width:520px;margin:5vh auto;padding:28px;background:#111d34;border:1px solid #6c5930;border-radius:12px}h1{font:700 2rem Georgia,serif;color:#e6c16e}label{display:block;margin:14px 0 5px}input{width:100%;padding:12px;background:#0a1224;color:white;border:1px solid #9e987e;border-radius:6px}button{margin-top:20px;padding:13px 20px;background:#d4af37;color:#091327;border:0;border-radius:6px;font-weight:700;cursor:pointer}button:disabled{opacity:.6}a{color:#e6c16e}#message{margin-top:18px}</style></head><body><main>
<a href="/">← Return to church website</a><h1>Become a member</h1><p>Register to join the Prayer Army International member community. Applications may require administrator approval.</p>
<form id="register"><label for="name">Full name</label><input id="name" name="displayName" autocomplete="name" required minlength="2" maxlength="150">
<label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
<label for="password">Password (at least 12 characters)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
<button type="submit">Submit membership application</button></form><p id="message" role="status" aria-live="polite"></p></main>
<script>document.getElementById('register').addEventListener('submit',async event=>{event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=document.getElementById('message');button.disabled=true;message.textContent='Submitting…';try{const payload=Object.fromEntries(new FormData(form));const response=await fetch('/api/public/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to register');message.textContent=data.message;form.reset();}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
