<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Activate Student Account | Prayer Army Academy</title><link rel="stylesheet" href="/academy-login.css?v=20261118-fit"><style>body{background:#f4f6f9}.activate{max-width:500px;margin:8vh auto;padding:36px;background:white;border:1px solid #dce5ed;border-radius:16px;box-shadow:0 16px 50px #10243e12}.activate h1{font:500 2.2rem Georgia,serif}.activate label{display:block;margin:18px 0 7px;font-weight:750}.activate input{width:100%;height:50px;border:1px solid #bfcdd9;border-radius:9px;padding:12px}.activate button{width:100%;background:#142d4a;color:#fff;border:0;border-radius:9px;padding:15px;margin-top:22px;font-weight:750}.activate p{line-height:1.6;color:#52677c}@media(max-width:550px){.activate{margin:16px;padding:24px}}</style></head><body><main class="activate"><a href="/academy">← Academy homepage</a><h1>Activate your student account</h1><p>If you've received an admission invitation, choose a secure password to activate your account. Your email address will be your login.</p><form id="activate"><label for="password">Create password (at least 12 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">Activate account</button><p id="status" role="status" aria-live="polite"></p></form></main><script type="module">const token=new URLSearchParams(location.search).get('token'),form=document.querySelector('#activate'),status=document.querySelector('#status');history.replaceState(null,'',location.pathname);if(!/^[0-9a-f]{64}$/.test(token||'')){status.textContent='Your invitation link is invalid or missing.';form.querySelector('button').disabled=true}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;if(password!==document.querySelector('#confirm').value){status.textContent='Passwords do not match';return}const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/academy/admissions/activate',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await r.json();if(!r.ok)throw Error(data.error||'Activation failed');status.replaceChildren(document.createTextNode(data.message+' '));const link=document.createElement('a');link.href='/academy/login/student';link.textContent='Go to student sign-in';status.append(link);form.reset();button.hidden=true}catch(err){status.textContent=err.message;button.disabled=false}})</script></body></html>
